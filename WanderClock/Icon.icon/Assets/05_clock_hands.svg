<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <g fill="#FFFFFF">
    <!-- Hour Hand (10:10 position -> 305° / -55°) -->
    <rect x="502.0" y="420.0" width="20" height="130" rx="10.0" transform="rotate(-55 512 540)" />
    <!-- Minute Hand (10 min position -> 60°) -->
    <rect x="504.5" y="370.0" width="15" height="180" rx="7.5" transform="rotate(60 512 540)" />
    <!-- Center Hub Pivot -->
    <circle cx="512" cy="540" r="26" />
    <circle cx="512" cy="540" r="14" fill="#E6EEF8" />
  </g>
</svg>
